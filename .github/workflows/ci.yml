name: CI

# Parked while the platform is still in development. The suite needs services this
# workflow does not provision yet (a Postgres for the dbt targets, a Linux-container
# Docker daemon, a JDK for the Spark path), so a red check was reporting the runner's
# environment rather than the change. Nothing is lost: every job below is intact, and
# re-enabling is this edit plus deleting `workflow_dispatch` --
#
#     on:
#       push:
#         branches: [main]
#       pull_request:
#
on:
  workflow_dispatch:

jobs:
  # Linux is the primary deployment target, so the suite must be green there —
  # not only on the Windows machine this project is developed on.
  linux:
    name: backend + frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the backend suite
        working-directory: backend
        # The suite spawns real child processes and a real uvicorn for the crash
        # test, so it needs a little more room than the default.
        timeout-minutes: 25
        run: python -m pytest tests -q

      - name: Blocking-call scan
        working-directory: backend
        run: python scripts/find_blocking_calls.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build the SPA the backend serves
        working-directory: frontend
        run: npm run build

      - name: Smoke-test the built SPA is served by the backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 --app-dir . &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8010/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8010/health
          curl -fsS http://127.0.0.1:8010/ | grep -qi '<div id="root"' && echo 'SPA served'
          curl -fsS http://127.0.0.1:8010/pipelines | grep -qi '<div id="root"' && echo 'SPA fallback works'

  windows:
    name: backend (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the backend suite
        working-directory: backend
        timeout-minutes: 25
        run: python -m pytest tests -q
