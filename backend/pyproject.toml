[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obelisk-backend"
version = "0.1.0"
description = "Obelisk: Pluggable On-Premise Data Platform & Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "duckdb>=0.10.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "docker>=7.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "croniter>=2.0.0",
    "dagster-graphql>=1.6.0",
    "dlt>=0.4.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pymongo>=4.6.0",
    "pymysql>=1.1.0",
    "oracledb>=2.1.0",
    "marimo>=0.3.0",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "dbt-clickhouse>=1.7.0",
    "pyspark[connect]>=3.5.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
