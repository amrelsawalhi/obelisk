<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Foundation Slab -->
  <rect x="4" y="20.5" width="16" height="2" rx="0.6" fill="#0284c7" />
  <!-- Upper Pedestal Plinth -->
  <rect x="6.5" y="19" width="11" height="1.5" rx="0.3" fill="#0ea5e9" />
  <!-- Left Shaft Face (Light) -->
  <polygon points="9.5,6.5 8,19 12,19 12,7.5" fill="#38bdf8" />
  <!-- Right Shaft Face (Shadow) -->
  <polygon points="12,7.5 12,19 16,19 14.5,6.5" fill="#0369a1" />
  <!-- Left Pyramidion Capstone (Lit) -->
  <polygon points="12,1.5 9.5,6.5 12,7.5" fill="#7dd3fc" />
  <!-- Right Pyramidion Capstone (Shadow) -->
  <polygon points="12,1.5 12,7.5 14.5,6.5" fill="#0284c7" />
  <!-- Capstone accent seam -->
  <path d="M9.5 6.5 L12 7.5 L14.5 6.5" stroke="#e0f2fe" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
