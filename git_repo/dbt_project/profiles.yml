obelisk:
  target: "{{ env_var('DBT_TARGET', 'lakehouse') }}"
  outputs:
    # Marts live in the lakehouse itself: this target attaches the DuckLake catalog, so
    # `dbt run` writes tables the catalog tree, the SDK and Query Studio can see without
    # any import step. It is the default because a warehouse you do not have to import
    # into is the point of the platform; set DBT_TARGET=dev to publish into PostgreSQL.
    lakehouse:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dbt.duckdb') }}"
      schema: main
      threads: "{{ env_var('DBT_DUCKDB_THREADS', '1') | int }}"
      settings:
        memory_limit: "{{ env_var('DBT_DUCKDB_MEMORY_LIMIT', '4GiB') }}"
        max_temp_directory_size: "{{ env_var('DBT_DUCKDB_MAX_TEMP_SIZE', '25GiB') }}"
        preserve_insertion_order: false
        # Do not declare temp_directory here. dbt-duckdb re-applies these settings on
        # every cursor, and DuckDB refuses to switch temp_directory after first use.
      extensions:
        - ducklake
      attach:
        - path: "ducklake:sqlite:{{ env_var('DBT_LAKEHOUSE_CATALOG') }}"
          alias: lakehouse
          is_ducklake: true
          # DuckLake refuses to create a catalog without a data path, so `dbt compile`
          # on a fresh install failed before any ingestion had created one. The runner
          # exports the same path the app writes Parquet to.
          options:
            data_path: "{{ env_var('DBT_LAKEHOUSE_DATA_PATH', 'data/lakehouse') }}"
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PG_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_PG_USER', 'testuser') }}"
      password: "{{ env_var('DBT_PG_PASSWORD', 'testpass') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME', 'sourcedb') }}"
      schema: public
      sslmode: "{{ env_var('DBT_PG_SSLMODE', 'disable') }}"
      threads: 1
      connect_timeout: 10
      keepalives_idle: 0
