name: 'obelisk_dbt'
version: '1.0.0'
config-version: 2

profile: 'obelisk'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Which layer each model folder writes to. These are layer *paths* from the
  # workspace's own layer tree, not fixed tiers - point them at whatever the layers
  # are called. Obelisk resolves each path to a warehouse schema (marts.sales ->
  # marts__sales) and passes the mapping in with --vars. Run dbt on its own and the
  # path is used verbatim as the schema name.
  #
  # The defaults are repeated inline below because dbt renders +schema while it is
  # still reading this file, before the block above is in scope.
  obelisk_dbt:
    layer_staging: raw
    layer_marts: marts

models:
  obelisk_dbt:
    staging:
      +schema: "{{ var('layer_staging', 'raw') }}"
      +materialized: table
    marts:
      +schema: "{{ var('layer_marts', 'marts') }}"
      +materialized: table

