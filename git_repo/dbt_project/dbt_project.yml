name: 'obelisk_dbt'
version: '1.0.0'
config-version: 2

profile: 'obelisk'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Folders under models/ are plain folders. `+schema` names the schema a folder's
# models are written to — dbt's own configuration, with no layer or mapping behind it.
# Obelisk reads the same names to know which warehouse folder to stage from and into.
models:
  obelisk_dbt:
    # On the lakehouse target, models write into the attached DuckLake catalog, so the
    # results are visible to the catalog tree and Query Studio with no import step. On
    # any other adapter the database is whatever that adapter says it is.
    +database: "{{ 'lakehouse' if target.type == 'duckdb' else target.database }}"
    staging:
      +schema: raw
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

