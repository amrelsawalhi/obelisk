version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw ingested datasets synchronized from Obelisk Bronze Parquet files."
    tables:
      - name: orders
        description: "Raw orders table"
        columns:
          - name: order_id
            tests:
              - not_null
      - name: customers
        description: "Raw customers table"
        columns:
          - name: customer_id
            tests:
              - not_null
      - name: ecommerce_orders
        description: "Raw enterprise e-commerce orders extracted from PostgreSQL"
        columns:
          - name: order_id
            tests:
              - not_null
      - name: ecommerce_customers
        description: "Raw enterprise customers extracted from PostgreSQL"
        columns:
          - name: customer_id
            tests:
              - not_null

models:
  - name: stg_orders
    description: "Cleaned and typed orders in Silver schema"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: stg_customers
    description: "Cleaned customer dimensions in Silver schema"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_order_metrics
    description: "Aggregated order spending metrics per customer in Silver schema"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_revenue
    description: "Aggregated revenue mart by customer tier in Gold schema"
    columns:
      - name: customer_tier
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: dim_customers
    description: "Customer lifetime value mart in Gold schema"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_orders_enriched
    description: "Orders enriched with customer profile dimensions in Gold schema"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_enterprise_customers
    description: "Silver cleaned enterprise customers with unpacked JSON metadata"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Standard', 'Silver', 'Gold', 'Platinum']

  - name: stg_enterprise_orders
    description: "Silver cleaned enterprise orders with net amount calculations"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: fct_enterprise_revenue
    description: "Gold analytical revenue mart aggregated by customer tier and currency"
    columns:
      - name: customer_tier
        tests:
          - not_null
      - name: net_realized_revenue
        tests:
          - not_null
