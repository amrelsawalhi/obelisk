version: 2

sources:
  # `landing` is only this source's name inside the project. The schema it reads is
  # the folder the staging models write to, so the pipeline and the models agree.
  - name: landing
    schema: raw
    description: "Raw datasets in the warehouse's raw folder."
    tables:
      - name: orders
        description: "Raw orders table"
        columns:
          - name: order_id
            tests:
              - not_null
      - name: customers
        description: "Raw customers table"
        columns:
          - name: customer_id
            tests:
              - not_null
      - name: ecommerce_orders
        description: "Raw enterprise e-commerce orders extracted from PostgreSQL"
        columns:
          - name: order_id
            tests:
              - not_null
      - name: ecommerce_customers
        description: "Raw enterprise customers extracted from PostgreSQL"
        columns:
          - name: customer_id
            tests:
              - not_null
      - name: e2e_orders
        description: "Orders ingested from the e2e PostgreSQL source into raw/"
        columns:
          - name: order_id
            tests:
              - not_null

models:
  - name: stg_orders
    description: "Cleaned and typed orders"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: stg_customers
    description: "Cleaned customer dimensions"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_order_metrics
    description: "Aggregated order spending metrics per customer"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_revenue
    description: "Aggregated revenue mart by customer tier"
    columns:
      - name: customer_tier
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: dim_customers
    description: "Customer lifetime value mart"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_orders_enriched
    description: "Orders enriched with customer profile dimensions"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_enterprise_customers
    description: "Cleaned enterprise customers with unpacked JSON metadata"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Standard', 'Silver', 'Gold', 'Platinum']

  - name: stg_enterprise_orders
    description: "Cleaned enterprise orders with net amount calculations"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: fct_enterprise_revenue
    description: "Analytical revenue mart aggregated by customer tier and currency"
    columns:
      - name: customer_tier
        tests:
          - not_null
      - name: net_realized_revenue
        tests:
          - not_null

  - name: stg_e2e_orders
    description: "Cleaned e2e orders staged from the raw folder"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: region
        tests:
          - not_null

  - name: fct_e2e_revenue
    description: "Revenue by region for the e2e orders, excluding returns"
    columns:
      - name: region
        tests:
          - not_null
